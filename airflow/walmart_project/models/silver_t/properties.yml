version: 2

models:
  - name: products_t
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique:
              config:
                where: "price > 0"

      - name: product_name
        data_tests:
          - not_null

    
  - name: stores_t
    columns:
      - name: store_id
        data_tests:
          - not_null
          - unique
